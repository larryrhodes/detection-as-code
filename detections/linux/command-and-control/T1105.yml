title: Ingress Tool Transfer - File Download via Web Utility
id: b3f7e1a2-9c4d-4e61-8b5f-2c3d4e5f6a7b
status: experimental
description: >
  Detects adversaries using built-in Linux utilities (wget, curl) to download
  tools or payloads from external sources into common staging directories.
  Ingress Tool Transfer is a core enabler for follow-on execution and lateral
  movement.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1105/T1105.md
author: Detection-as-Code Pipeline
date: 2026/07/27
modified: 2026/07/27
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  product: linux
  service: auditd
  category: process_creation
detection:
  selection_wget:
    type: EXECVE
    a0|contains: 'wget'
    a2|contains:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm'
  selection_curl:
    type: EXECVE
    a0|contains: 'curl'
    a2|contains:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm'
  condition: selection_wget or selection_curl
falsepositives:
  - Legitimate administrator file downloads to temp locations
  - CI/CD pipeline artifact staging
  - Package manager pre-install scripts
level: medium
fields:
  - audit.execve.a0
  - audit.execve.a1
  - audit.execve.a2
  - audit.auid
  - audit.pid