---
title: OS Credential Dumping
id: T1003
status: experimental
description: >
  Adversaries dump stored account credentials such as hashes or plaintext
  passwords from system memory and caches to escalate access and move
  laterally through a network.
references:
  - https://attack.mitre.org/techniques/T1003/
author: Larry Rhodes
date: 2026/07/20
tags:
  - attack.credential_access
  - attack.t1003
logsource:
  product: linux
  service: auditd
detection:
  selection:
    type: EXECVE
    a0: cat
    a1|contains: /etc/shadow
  condition: selection
falsepositives:
  - Legitimate administrative software such as IT diagnostics or backup
    utilities accessing system memory.
  - Authorized penetration testing tools.
level: high